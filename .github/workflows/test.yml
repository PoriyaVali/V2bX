name: Test

on:
  push:
    branches:
      - master
      - dev_new
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/test.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vet + race tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      # Vet below covers a chosen subset of packages, so a package outside that
      # list can stop compiling without this workflow noticing - core/ among
      # them, which is where every protocol implementation lives. Building the
      # whole module first is the cheap guard against a green run on a tree that
      # does not build.
      - name: Build (whole module)
        env:
          GOEXPERIMENT: jsonv2
        run: go build ./...

      # The untagged build above never compiles core/imports/*, because every
      # core registers itself from an init() behind a build tag. That is the
      # path a release actually ships, and a core missing from it produces a
      # binary that starts and then refuses its own config with "unknown core
      # type" - so build it here with the same tags a release uses.
      - name: Build (release tags)
        env:
          GOEXPERIMENT: jsonv2
        run: |
          go build -o /tmp/V2bX_tagged \
            -tags "sing xray hysteria2 with_quic with_grpc with_utls with_wireguard with_acme with_gvisor mdns trusttunnel" ./

      # A tag that compiles proves nothing about the core being registered, so
      # check the names are actually in the binary.
      - name: Cores are registered
        run: |
          for core in sing xray hysteria2 mdns trusttunnel; do
            if grep -qa "$core" /tmp/V2bX_tagged; then
              echo "  $core: present"
            else
              echo "  $core: MISSING from the binary"; exit 1
            fi
          done

      - name: Vet
        env:
          GOEXPERIMENT: jsonv2
        run: go vet ./limiter/... ./node/... ./conf/... ./api/... ./common/... ./core/...

      # The limiter is the one place where a data race is not a nuisance but a
      # correctness bug: CheckLimit runs on every connection while the node's
      # poll and speed-checker goroutines mutate the same per-user state. Run it
      # under the race detector so a regression there fails here, not in prod.
      # -timeout 5m so a test that hangs fails fast instead of burning ten
      # minutes of runner time before the default deadline kills it.
      - name: Test (race detector)
        env:
          GOEXPERIMENT: jsonv2
        run: go test -race -count=1 -timeout 5m ./limiter/... ./node/... ./conf/... ./common/...
